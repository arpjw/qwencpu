<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic byte CPU and separate-cache text bridge</title>
  <desc id="desc">The host supplies PAD and LOAD tokens to four Gated DeltaNet ROM heads. Model-generated TICK tokens execute instructions, updating register and RAM heads and emitting state tokens. A text bridge uses the same merged 9B weights with separate text and CPU caches, routing the result back as a normal tool response.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1099" height="629" rx="20" fill="#f8fafc" stroke="#dbe4ef"/>
  <text x="34" y="48" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">A byte CPU in Gated DeltaNet state</text>
  <text x="34" y="78" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="17">One dynamic 9B checkpoint loads different programs; a separate-cache bridge connects it to text.</text>

  <rect x="30" y="108" width="696" height="478" rx="18" fill="#ecfdf5" stroke="#99f6e4" stroke-width="2"/>
  <rect x="748" y="108" width="322" height="478" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="54" y="149" fill="#115e59" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Fresh CPU cache</text>
  <text x="770" y="149" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Separate-cache text bridge</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="54" y="184" width="178" height="100" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="71" y="210" fill="#0f766e" font-size="13" font-weight="700">1  PROGRAM INPUT</text>
    <text x="71" y="238" fill="#0f172a" font-size="17" font-weight="700">PAD + LOAD</text>
    <text x="71" y="261" fill="#475569" font-size="14">address, byte pairs</text>

    <rect x="268" y="184" width="188" height="100" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="285" y="210" fill="#0f766e" font-size="13" font-weight="700">2  RECURRENT ROM</text>
    <text x="285" y="238" fill="#0f172a" font-size="17" font-weight="700">Four GDN heads</text>
    <text x="285" y="261" fill="#475569" font-size="14">op + arg, two banks each</text>

    <rect x="492" y="184" width="208" height="100" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="509" y="210" fill="#0f766e" font-size="13" font-weight="700">3  MODEL EXECUTION</text>
    <text x="509" y="238" fill="#0f172a" font-size="17" font-weight="700">TICK</text>
    <text x="509" y="261" fill="#475569" font-size="14">fetch, decode, update</text>

    <rect x="54" y="364" width="198" height="100" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="71" y="390" fill="#0f766e" font-size="13" font-weight="700">5  GENERATED OUTPUT</text>
    <text x="71" y="418" fill="#0f172a" font-size="17" font-weight="700">State token</text>
    <text x="71" y="441" fill="#475569" font-size="14">PC, ACC, HALT bits</text>

    <rect x="288" y="364" width="180" height="100" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="305" y="390" fill="#0f766e" font-size="13" font-weight="700">4  REGISTER STATE</text>
    <text x="305" y="418" fill="#0f172a" font-size="17" font-weight="700">GDN head</text>
    <text x="305" y="441" fill="#475569" font-size="14">PC, ACC, HALT</text>

    <rect x="504" y="364" width="196" height="100" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="521" y="390" fill="#0f766e" font-size="13" font-weight="700">4  MEMORY STATE</text>
    <text x="521" y="418" fill="#0f172a" font-size="17" font-weight="700">GDN RAM head</text>
    <text x="521" y="441" fill="#475569" font-size="14">16 addressed bytes</text>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)">
    <path d="M232 234 H262"/>
    <path d="M456 234 H486"/>
    <path d="M596 284 V326 H378 V358"/>
    <path d="M596 326 H602 V358"/>
    <path d="M288 414 H258"/>
  </g>
  <text x="54" y="508" fill="#115e59" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Generated stream: TICK → state → TICK → state, until HALT</text>
  <text x="54" y="539" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14">ROM and RAM remain in recurrent cache. The host does not execute each CPU step.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="768" y="178" width="282" height="76" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="786" y="203" fill="#6d28d9" font-size="13" font-weight="700">TEXT CACHE  ·  SAME WEIGHTS</text>
    <text x="786" y="230" fill="#0f172a" font-size="16" font-weight="700">9B selects byte_add7(x)</text>

    <rect x="768" y="280" width="282" height="76" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="786" y="305" fill="#6d28d9" font-size="13" font-weight="700">HOST ROUTER</text>
    <text x="786" y="332" fill="#0f172a" font-size="16" font-weight="700">Parse x, supply raw LOAD IDs</text>

    <rect x="768" y="382" width="282" height="76" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="786" y="407" fill="#6d28d9" font-size="13" font-weight="700">FRESH CPU CACHE  ·  SAME WEIGHTS</text>
    <text x="786" y="434" fill="#0f172a" font-size="16" font-weight="700">Execute, decode result byte</text>

    <rect x="768" y="484" width="282" height="76" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="786" y="509" fill="#6d28d9" font-size="13" font-weight="700">FRESH TEXT CACHE  ·  SAME WEIGHTS</text>
    <text x="786" y="536" fill="#0f172a" font-size="16" font-weight="700">Tool response → final answer</text>
  </g>
  <g fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-violet)">
    <path d="M909 254 V274"/>
    <path d="M909 356 V376"/>
    <path d="M909 458 V478"/>
  </g>
  <text x="34" y="611" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">The host routes calls and responses. The model generates the CPU trace; raw CPU tokens stay out of the text cache.</text>
</svg>
